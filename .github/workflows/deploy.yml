name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Post-deploy on Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, openssl, zip, gd, intl, exif, pcntl, bcmath, curl, xml, fileinfo
          coverage: none

      - name: Install Composer dependencies locally (for deploy artifacts)
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -e
            cd ~/domains/lightgoldenrodyellow-dugong-584603.hostingersite.com/public_html

            echo "=== Pull latest code from Hostinger's Git mirror ==="
            # Hostinger's Git deploy already pulled this. If using manual pull:
            # git pull origin main

            echo "=== Install PHP dependencies (no-dev) ==="
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "=== Run migrations ==="
            php artisan migrate --force

            echo "=== Clear and rebuild caches ==="
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=== Storage symlink ==="
            php artisan storage:link || true

            echo "=== Restart queue workers ==="
            php artisan queue:restart || true

            echo "=== Deploy complete ==="