name: Tests

on:
  push:
    branches: [main, develop, phase-11-resume]
  pull_request:
    branches: [main, develop, phase-11-resume]

jobs:
  tests:
    name: Run test suite
    runs-on: ubuntu-latest

    # PHASE 23C-R5 — the Meilisearch master key, handed to BOTH the service and
    # the test process so the two can never disagree. Set the repository secret
    # MEILI_MASTER_KEY to use a real one; the literal fallback keeps an unset
    # secret self-consistent instead of leaving the service keyless while the
    # application sends a key. Either way nothing sensitive is committed.
    env:
      MEILISEARCH_KEY: ${{ secrets.MEILI_MASTER_KEY || 'ci-meilisearch-master-key' }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: omniscient_testing
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      # PHASE 23C-R5 — previously CI ran with SCOUT_DRIVER=null and no search
      # engine. The suite now targets test_listings / test_categories, and the
      # PHPUnit bootstrap writes that index's settings before any test runs, so
      # a real Meilisearch must exist. Pinned to the version the local suite
      # runs against.
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        env:
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY || 'ci-meilisearch-master-key' }}
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
        options: >-
          --health-cmd="curl --fail http://localhost:7700/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, openssl, zip, gd, intl, exif, pcntl, bcmath, curl, xml, fileinfo, sqlite3
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Copy CI env
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u ci_user -pci_password --silent 2>/dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      # PHASE 23C-R5 — the health options above are advisory to the runner, so
      # wait explicitly. /health needs no authentication.
      - name: Wait for Meilisearch to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:7700/health >/dev/null 2>&1; then
              echo "Meilisearch is ready"
              exit 0
            fi
            echo "Waiting for Meilisearch... ($i/30)"
            sleep 2
          done
          echo "Meilisearch failed to start"
          exit 1

      - name: Diagnostic — dump env files and test MySQL connection
        run: |
          echo "===== .env content ====="
          cat .env
          echo ""
          echo "===== .env.testing presence ====="
          if [ -f .env.testing ]; then
            echo "WARNING: .env.testing exists and will be loaded during tests!"
            cat .env.testing
          else
            echo "OK: .env.testing does not exist (tests will use .env)"
          fi
          echo ""
          echo "===== MySQL service info ====="
          docker ps --format "{{.Names}} {{.Image}} {{.Ports}}"
          echo ""
          echo "===== Test connection as ci_user ====="
          mysql -h 127.0.0.1 -u ci_user -pci_password -e "SELECT USER(), CURRENT_USER();" || echo "ci_user FAILED"
          echo ""
          echo "===== Test connection as root ====="
          mysql -h 127.0.0.1 -u root -proot -e "SELECT USER(), CURRENT_USER();" || echo "root FAILED"
          echo ""
          echo "===== List MySQL users ====="
          mysql -h 127.0.0.1 -u root -proot -e "SELECT user, host FROM mysql.user;" || echo "List FAILED"
          echo ""
          echo "===== Show databases ====="
          mysql -h 127.0.0.1 -u root -proot -e "SHOW DATABASES;" || echo "Show FAILED"
          echo ""
          echo "===== Laravel resolved DB config ====="
          php artisan config:clear
          php artisan tinker --execute="echo json_encode([
            'default' => config('database.default'),
            'host' => config('database.connections.mysql.host'),
            'port' => config('database.connections.mysql.port'),
            'database' => config('database.connections.mysql.database'),
            'username' => config('database.connections.mysql.username'),
          ], JSON_PRETTY_PRINT);"
          echo ""
          echo "===== Laravel resolved scout config ====="
          echo "Never prints the key itself."
          php artisan tinker --execute="echo json_encode([
            'driver' => config('scout.driver'),
            'prefix' => config('scout.prefix'),
            'host' => config('scout.meilisearch.host'),
            'key_set' => (bool) config('scout.meilisearch.key'),
            'resolved_listing_index' => App\Support\SearchIndexName::listing(),
            'engine_usable' => App\Console\Commands\ConfigureMeilisearch::hasUsableEngine(),
          ], JSON_PRETTY_PRINT);"
          echo ""
          echo "===== Meilisearch health ====="
          curl -sS http://127.0.0.1:7700/health || echo "Meilisearch health check FAILED"

      - name: Run migrations
        run: php artisan migrate --force

      - name: Clear config cache
        run: php artisan config:clear

      - name: Run test suite
        run: php artisan test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: storage/logs/
          retention-days: 7